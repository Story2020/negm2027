<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أفضل الملتزمين بالحضور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f1ea;--card:#ffffff;--ink:#14202f;--mut:#5b6674;--track:#e4dfd3;--a:#c98a1f;--ac:#1f9e90;--nl:50%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2e;--card:#1b2d45;--ink:#eef2f6;--mut:#9fb3c8;--track:#26405e;--a:#e0a030;--nl:60%}}
:root[data-theme="dark"]{--bg:#0f1c2e;--card:#1b2d45;--ink:#eef2f6;--mut:#9fb3c8;--track:#26405e;--a:#e0a030;--nl:60%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:24px 18px 48px}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
h1.neon,.sub.neon{font-size:16px;font-weight:700;text-decoration:underline;text-underline-offset:5px;color:var(--ac);margin:0 0 8px;text-shadow:0 0 6px var(--ac),0 0 14px var(--ac);animation:nz 3.2s ease-in-out 1 both}
.sub.neon{animation-delay:.3s;margin-bottom:20px}
@keyframes nz{0%{opacity:0;text-shadow:none}25%,60%{opacity:1;text-shadow:0 0 12px var(--ac),0 0 30px var(--ac),0 0 60px var(--ac)}40%{opacity:.7;text-shadow:0 0 2px var(--ac)}}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.ctl button{font:inherit;font-size:15px;border:2px solid var(--ac);background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;transition:.2s}
.ctl button:hover{transform:translateY(-2px)}
.ctl #re{background:var(--ac);color:#fff}
.chart{display:flex;flex-direction:column;gap:6px}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px 255px 1fr 80px;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;cursor:pointer;opacity:0;transform:translateX(40px);transition:opacity .9s,transform .9s,background .25s}
.row.in{opacity:1;transform:none}
.chart:hover .row.in{opacity:.5}
.chart .row.in:hover,.chart .row.in.sel{opacity:1;background:var(--card);transform:scale(1.02)}
.row:focus-visible{outline:3px solid var(--ac)}
.rk{font-size:14px;color:var(--mut);text-align:center}
.nm{font-size:14px;font-weight:600}
.tr{height:26px;background:var(--track);border-radius:8px;overflow:hidden;position:relative}
.bar{display:block;height:100%;width:0;border-radius:8px;position:relative;overflow:hidden;background:var(--c);box-shadow:0 0 10px var(--c),0 0 22px var(--c);transition:width 2.8s cubic-bezier(.25,.8,.3,1)}
.bar::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(270deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.4s 1.4s infinite;transform:translateX(120%)}
@keyframes sh{to{transform:translateX(-320%)}}
.row:hover .bar{filter:brightness(1.15);box-shadow:0 0 14px var(--c),0 0 34px var(--c)}
.vl{font-weight:700;font-size:15px;text-align:left}
.note{font-size:13px;color:var(--mut);margin:10px 0 18px}
.det{position:relative;background:var(--card);border-radius:18px;padding:18px;display:flex;align-items:center;gap:18px;min-height:150px}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .bg{stroke:var(--track)}
.ring .fg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 2.6s cubic-bezier(.25,.8,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.dt h3{margin:0;font-size:20px}
.dt p{margin:2px 0 0;color:var(--mut)}
.sp{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--a);right:73px;top:50%;pointer-events:none;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media (max-width:600px){
.row{grid-template-columns:24px 1fr 70px;grid-template-areas:"rk nm nm" "rk tr vl";gap:2px 8px}
.rk{grid-area:rk}.nm{grid-area:nm}.tr{grid-area:tr}.vl{grid-area:vl}
.det{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1 class="neon">إدارة الموارد البشرية</h1>
<p class="sub neon">أفضل الملتزمين بالحضور من الفترة 26/10/2026 إلى 15/11/2026</p>
<div class="ctl">
<button id="re">▶ إعادة التشغيل</button>
<button id="pz">⏸ إيقاف التشغيل التلقائي</button>
</div>
<div class="chart" id="chart"></div>
<p class="note">الأعمدة تمثل أيام بلا تأخير، اضغط على أي موظف لرؤية التفاصيل.</p>
<div class="det" id="det">
<div class="ring"><svg width="110" height="110" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="fg" cx="60" cy="60" r="52"/></svg><b id="rv">—</b></div>
<div class="dt"><h3 id="dn">اختر موظفًا</h3><p id="dp">ستظهر هنا إدارته ووظيفته.</p><p id="dq">وكذلك رتبته والتزامه وجزاؤه.</p></div>
</div>
</main>
<script>
/* [الاسم, الإدارة, الوظيفة, نسبة الالتزام, الجزاء بالأيام, أيام بلا تأخير, إجمالي الأيام] */
const D=[
["أ/ ريمون جورج يعقوب حنا","إدارة المشتريات","مسئول تعاقدات سيارات",1,0,19,19],
["أ/ مجدى حامد عبد الرحيم","إدارة المبيعات","مدير المبيعات",0.947,0,18,19],
["أ/ محمد عاطف محمود محمد","إدارة المشتريات","مسئول مشتريات",1,0,19,19],
["أ/ احمد اسماعيل عبد الحافظ","إدارة الأشراف الداخلى","مشرف خدمات معاونة",1,0,22,22],
["أ/ تامر امال شفيق سليمان","إدارة التسويق","مسئول تسويق",1,0,21,21],
["أ/ نبيل زكى بدروس بشاى","إدارة مبيعات الأفراد","مسئول مبيعات",1,0,20,20],
["أ/ ميلاد سعيد عيسى سيدهم","إدارة الأشراف الداخلى","مسئول خدمات معاونة",1,0,17,17],
["أ/ محمود شفيق محمود رجب","الإدارة العامة","مدير الفروع",1,0,19,19],
["أ/ سعيد سعد ابراهيم جاد","إدارة الأشراف الداخلى","مسئول خدمات معاونة",1,0,19,19],
["أ/ حسين عبد العال منصور سالم","إدارة الأشراف الداخلى","مسئول خدمات معاونة",1,0,11,11],
["أ/ حاتم توفيق مصطفى كمال","إدارة التسويق","مسئول تسويق",1,0,13,13],
["أ/ يوسف عبد المنعم على","إدارة الأشراف الداخلى","مسئول خدمات معاونة",1,0,20,20],
["أ/ محمد السيد المصرى","إدارة المبيعات","مسئول مبيعات",1,0,17,17]];
const N=D.length,MAXD=Math.max(...D.map(d=>d[5]));
const $=s=>document.querySelector(s),chart=$('#chart');
const pc=c=>(c===1?'100':(c*100).toFixed(1))+'%';
const hue=i=>Math.round(i*(330/(N-1)));
const col=i=>'hsl('+hue(i)+' 100% var(--nl))';
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function count(el,from,to,fmt,dur=2800){
  if(reduce){el.textContent=fmt(to);return}
  const t0=performance.now();
  (function g(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(g)})(t0);
}
function render(){
  chart.innerHTML='';
  D.forEach((d,i)=>{
    const b=document.createElement('button');b.className='row';b.dataset.i=i;
    b.style.setProperty('--c',col(i));
    b.innerHTML='<span class="rk">'+(i+1)+'</span><span class="nm"'+(d[1]?' title="'+d[1]+'"':'')+'>'+d[0]+'</span><span class="tr"><span class="bar" data-w="'+(d[5]/MAXD*100).toFixed(1)+'"></span></span><span class="vl">0 يوم</span>';
    b.onclick=()=>pick(i,b);chart.appendChild(b);
  });
  play();
}
let auto=true,loopT,run=0;
const fp=c=>x=>(c===1?Math.round(x):x.toFixed(1))+'%';
function showAll(){[...chart.children].forEach(r=>{const b=r.querySelector('.bar');r.classList.add('in');b.style.width=b.dataset.w+'%';r.querySelector('.vl').textContent=D[r.dataset.i][5]+' يوم'})}
function play(){
  const my=++run;clearTimeout(loopT);
  const n=chart.children.length,step=reduce?0:1300;
  if(auto&&!reduce)loopT=setTimeout(()=>{if(my===run)play()},500+n*step+6000);
  [...chart.children].forEach((r,k)=>{
    const bar=r.querySelector('.bar'),vl=r.querySelector('.vl'),c=D[r.dataset.i][5];
    r.classList.remove('in');bar.style.transition='none';bar.style.width='0';vl.textContent='0 يوم';
    void bar.offsetWidth;bar.style.transition='';
    setTimeout(()=>{if(my!==run)return;r.classList.add('in');bar.style.width=bar.dataset.w+'%';count(vl,0,c,x=>Math.round(x)+' يوم');if(auto)pick(+r.dataset.i,r)},reduce?0:500+k*step);
  });
}
function pick(i,row){
  const [n,dp,jb,cp,pn,dk,dt]=D[i];
  document.querySelectorAll('.row.sel').forEach(x=>x.classList.remove('sel'));row.classList.add('sel');
  $('#dn').textContent=n;
  $('#dp').textContent=dp?dp+' — '+jb:'الإدارة والوظيفة غير متوفرتين في الكشف';
  $('#dq').textContent='المركز '+(i+1)+' من '+N+' — أيام بلا تأخير '+dk+' من '+dt+' — الجزاء '+pn+' يوم';
  const c=col(i);
  $('#fg').style.stroke=c;$('#fg').style.filter='drop-shadow(0 0 6px '+c+')';
  $('#fg').style.strokeDashoffset=327;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#fg').style.strokeDashoffset=(327*(1-cp)).toFixed(1)}));
  count($('#rv'),0,dk,x=>Math.round(x)+' يوم',2600);
  if(!reduce)burst(c);
}
function burst(c){
  const d=$('#det');
  for(let k=0;k<12;k++){
    const s=document.createElement('i'),a=k/12*6.283,r=50+Math.random()*40;
    s.className='sp';s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r+'px');
    s.style.background=c;s.style.boxShadow='0 0 8px '+c;
    d.appendChild(s);setTimeout(()=>s.remove(),850);
  }
}
$('#re').onclick=play;
$('#pz').onclick=function(){auto=!auto;if(auto){this.textContent='⏸ إيقاف التشغيل التلقائي';play()}else{this.textContent='▶ تشغيل تلقائي';run++;clearTimeout(loopT);showAll()}};
render();
</script>
</body>
</html>
